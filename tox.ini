[tox]
envlist = all

skipsdist = True
install_command = python -m pip install --cache-dir=.pip-cache {opts} {packages}

[testenv]
basepython=python

# Due to eMudhra (https://emudhra.we-have-a-problem.com/) we must use pip version 26.2.2
deps =
    -r ci/requirements/pip-requirements.txt
    -r klayout_package/python/requirements/linux/requirements.txt
    -r klayout_package/python/requirements/linux/dev-requirements.txt
    -r klayout_package/python/requirements/linux/sim-requirements.txt

[testenv:latest_klayout]
commands =
    pip --cache-dir=.pip-cache install --no-deps --no-build-isolation -e "klayout_package/python/"
    python -m pytest tests --runslow -n8 --quiet --cov --cov-report=term-missing --junitxml=test_report.xml
commands_post =
    pip show klayout

[testenv:matrix]
commands =
    pip --cache-dir=.pip-cache install --force-reinstall -r "ci/requirements/{env:KLAYOUT_VERSION}-requirements.txt"
    pip --cache-dir=.pip-cache install --no-deps --no-build-isolation -e "klayout_package/python/"
    python -m pytest tests --runslow -n8 --quiet --cov --cov-report=term-missing --junitxml=test_report.xml
commands_post =
    pip show klayout

[testenv:static_analysis]
deps =
    -r ci/requirements/pip-requirements.txt
    -r klayout_package/python/requirements/linux/requirements.txt
    -r klayout_package/python/requirements/linux/dev-requirements.txt
    -r ci/requirements/pylint-gitlab-requirements.txt
commands =
    pip --cache-dir=.pip-cache install --no-deps --no-build-isolation -e "klayout_package/python/"
    python -m pylint klayout_package/ tests/ util/ {posargs}{env:CODEQUALITY_JSON:}
    python -m black --check -l 120 -t py311 -t py312 -t py313 -t py314 .

[testenv:docs]
changedir=docs
allowlist_externals=make
commands =
    pip --cache-dir=.pip-cache install --no-deps --no-build-isolation -e "../klayout_package/python/"
    make html SPHINXOPTS="-W --keep-going"

[testenv:layer_properties]
commands =
    pip --cache-dir=.pip-cache install --no-deps --no-build-isolation -e "klayout_package/python/"
    python util/check_layer_props.py

[testenv:copyright_headers]
command = python ci/check_copyright_headers.py --exclude-paths

[testenv:check_build]
deps =
    -r ci/requirements/pip-requirements.txt
    -r ci/requirements/twine-requirements.txt
changedir=klayout_package/python
commands=
    python -m build
    python -m twine check dist/*
